[project]
name = "obsidian-conscierge"
version = "1.0.0"
description = "AI-driven knowledge management system for Obsidian"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["obsidian", "knowledge-management", "ai", "vector-search", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    # Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",

    # LLM & Embedding
    "ollama>=0.1.0",
    "sentence-transformers>=2.2.0",

    # Vector Database
    "chromadb>=0.4.22",

    # Natural Language Processing (既存実装で使用)
    "scikit-learn>=1.3.2",
    "janome>=0.5.0",
    "numpy>=1.24.0",

    # Content Processing
    "python-frontmatter>=1.0.0",
    "markdown>=3.5.0",

    # Git Operations
    "GitPython>=3.1.40",

    # Environment & Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Utilities
    "tqdm>=4.66.0",
    "click>=8.1.7",

    # Date & Time
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",  # For testing FastAPI endpoints

    # Code Quality
    "ruff>=0.1.7",
    "mypy>=1.7.1",

    # Type Stubs
    "types-python-dateutil>=2.8.19",
    "types-tqdm>=4.66.0",
]

analysis = [
    # Advanced Analysis (Phase 3)
    "umap-learn>=0.5.5",  # For knowledge map visualization
    "scikit-learn>=1.3.2",  # Clustering algorithms
]

[project.urls]
Homepage = "https://github.com/yourusername/ObsidianConscierge"
Repository = "https://github.com/yourusername/ObsidianConscierge"
Issues = "https://github.com/yourusername/ObsidianConscierge/issues"

[project.scripts]
obsidian-conscierge = "app.cli:main"
oc-index = "scripts.initial_index:main"
oc-search = "scripts.search_cli:main"
oc-sync = "scripts.git_sync:main"
oc-report = "scripts.daily_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "ollama.*",
    "janome.*",
    "sklearn.*",
    "frontmatter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
